name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/check_repository.py
      - run: git lfs fsck
      - run: uv run python scripts/restore_experiments.py --out restored
      - run: >-
          uv run jev-atari replay
          --episode restored/artifacts/policy-online-v1/development-candidate-resumed/seed-27
          --out artifacts/ci-replay
      - run: >-
          uv run python scripts/restore_experiments.py
          --manifest experiments/pong-controls-v1-2026-09-18.manifest.json
          --out restored-controls
      - run: >-
          uv run python scripts/verify_controls.py
          --run restored-controls/pong-controls-v1
          --out artifacts/ci-controls-audit
