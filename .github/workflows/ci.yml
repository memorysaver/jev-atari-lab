name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/check_repository.py
      - run: git lfs fsck
      - run: uv run python scripts/restore_experiments.py --out restored
      - run: >-
          uv run jev-atari replay
          --episode restored/artifacts/policy-online-v1/development-candidate-resumed/seed-27
          --out artifacts/ci-replay
      - run: >-
          uv run python scripts/restore_experiments.py
          --manifest experiments/pong-controls-v1-2026-09-18.manifest.json
          --out restored-controls
      - run: >-
          uv run python scripts/verify_controls.py
          --run restored-controls/pong-controls-v1
          --out artifacts/ci-controls-audit
      - run: >-
          uv run python scripts/restore_experiments.py
          --manifest experiments/pong-no-fire-study-2026-09-18.manifest.json
          --out restored-no-fire
      - run: >-
          uv run python scripts/verify_no_fire.py
          --source restored-no-fire/pong-no-fire-study
          --baseline restored-controls/pong-controls-v1
          --out artifacts/ci-no-fire-audit
      - run: >-
          uv run python scripts/restore_experiments.py
          --manifest experiments/pong-match-calibration-v1-2026-09-18.manifest.json
          --out restored-match-calibration
      - run: >-
          uv run python scripts/verify_matches.py
          --run restored-match-calibration/pong-match-calibration-v1
          --out artifacts/ci-match-calibration-audit
      - run: >-
          uv run python scripts/restore_experiments.py
          --manifest experiments/pong-match-feasibility-v1-2026-09-18.manifest.json
          --out restored-match-feasibility
      - run: >-
          uv run python scripts/verify_matches.py
          --run restored-match-feasibility/pong-match-feasibility-v1
          --out artifacts/ci-match-feasibility-audit
      - run: >-
          uv run python scripts/restore_experiments.py
          --manifest experiments/pong/teacher-study-v1/teacher-study-v1.manifest.json
          --out restored-teacher-study
      - run: >-
          uv run python scripts/verify_teacher_study.py
          --run restored-teacher-study/teacher-study-v1/run
          --out artifacts/ci-teacher-study-audit
      - run: >-
          uv run python scripts/summarize_teacher_study.py
          --run restored-teacher-study/teacher-study-v1/run
          --audit artifacts/ci-teacher-study-audit
          --out artifacts/ci-teacher-study-report
      - run: >-
          cmp experiments/pong/teacher-study-v1/descriptive-results.json
          artifacts/ci-teacher-study-report/descriptive-results.json
      - run: >-
          uv run python scripts/restore_experiments.py
          --manifest experiments/pong/question-diagnostics-v1/question-diagnostics-v1.manifest.json
          --out restored-question-diagnostics
      - run: >-
          uv run python scripts/question_diagnostics.py verify
          --run restored-question-diagnostics/question-diagnostics-v1/local
          --out artifacts/ci-question-diagnostics-replay
      - run: >-
          uv run python scripts/question_diagnostics.py analyze
          --study restored-teacher-study/teacher-study-v1/run
          --out artifacts/ci-question-diagnostics-analysis
      - run: >-
          cmp experiments/pong/question-diagnostics-v1/adherence.json
          artifacts/ci-question-diagnostics-analysis/results.json
