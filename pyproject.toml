[project]
name = "jev-atari-lab"
version = "0.2.0"
description = "Challenge Atari with Jev: structured decisions, value questions, and replayable evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ale-py>=0.11,<0.12",
  "gymnasium>=1.1,<2",
  "numpy>=2,<3",
  "httpx>=0.28,<0.29",
  "imageio[ffmpeg]>=2.37,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
jev-atari = "jev_atari.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_atari"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "jev_atari/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
